[versions]
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlin-wrappers-node = "2026.8.4-24.12.4"
ktor = "3.5.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-wrappers-node = { module = "org.jetbrains.kotlin-wrappers:kotlin-node", version.ref = "kotlin-wrappers-node" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
ktor-utils = { module = "io.ktor:ktor-utils", version.ref = "ktor" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
temp-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }